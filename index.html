<!doctype html><html lang='pt-BR'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#173f2a'><link rel='manifest' href='manifest.json'><link rel='stylesheet' href='style.css'><title>Minha Dieta</title></head><body><header><div><small>PLANO ALIMENTAR</small><h1>Minha Dieta</h1></div><button id='settings'>⚙️</button></header><main><section class='hero'><div><small>PRÓXIMA REFEIÇÃO</small><h2 id='nextName'>—</h2><p id='nextTime'>—</p></div><div class='ring' id='countdown'>--:--</div></section><section id='today'></section><section class='summary'><h3>Hoje</h3><div class='stats'><b id='doneCount'>0/5</b><span>refeições realizadas</span></div><div id='history'></div></section></main><dialog id='mealDialog'><form method='dialog'><button class='close'>✕</button><h2 id='mealTitle'></h2><p class='muted'>Marque o que você realmente consumiu.</p><div id='mealOptions'></div><textarea id='note' placeholder='Observação (opcional)'></textarea><div class='actions'><button type='button' class='secondary' id='skip'>Pulei esta refeição</button><button type='button' class='primary' id='saveMeal'>✓ Comi</button></div></form></dialog><dialog id='settingsDialog'><form method='dialog'><button class='close'>✕</button><h2>Horários</h2><div id='timeSettings'></div><hr><button type='button' id='notify' class='secondary'>Ativar notificações</button><button type='button' id='backup' class='secondary'>Exportar backup</button><label class='secondary file'>Importar backup<input id='restore' type='file' accept='.json'></label><button class='primary'>Salvar</button></form></dialog><script src='app.js'></script></body></html>

name: Gerar APK Minha Dieta
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: ['app/**','build.gradle','settings.gradle','.github/workflows/android-apk.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copiar PWA para Android
        run: |
          mkdir -p app/src/main/assets/www
          cp index.html style.css app.js manifest.json sw.js icon.svg app/src/main/assets/www/
      - name: Gerar APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Minha-Dieta-Android-1.1.0
          path: app/build/outputs/apk/debug/app-debug.apk
